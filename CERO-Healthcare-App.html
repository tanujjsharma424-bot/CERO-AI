    // --- Web Audio API Synthesizer (Siren, Ringtone, Chimes & Speech) ---
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
        this.sosActive = false;
        this.sosInterval = null;
        this.ringInterval = null;
      }
      getCtx() {
        if (!this.ctx && typeof window !== 'undefined') {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) this.ctx = new AudioContextClass();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
        return this.ctx;
      }
      playChime() {
        if (this.muted) return;
        try {
          const ctx = this.getCtx();
          if (!ctx) return;
          const now = ctx.currentTime;
          const notes = [523.25, 659.25, 783.99, 1046.50];
          notes.forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.07);
            gain.gain.setValueAtTime(0, now + idx * 0.07);
            gain.gain.linearRampToValueAtTime(0.2, now + idx * 0.07 + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.07 + 0.35);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + idx * 0.07);
            osc.stop(now + idx * 0.07 + 0.38);
          });
        } catch(e) {}
      }
      playClick() {
        if (this.muted) return;
        try {
          const ctx = this.getCtx();
          if (!ctx) return;
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(800, now);
          osc.frequency.exponentialRampToValueAtTime(400, now + 0.05);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.05);
        } catch(e) {}
      }
      startSosAlarm() {
        this.stopSosAlarm();
        this.sosActive = true;
        if ('speechSynthesis' in window && !this.muted) {
          try {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance('Emergency medical alert triggered. Emergency contacts notified.');
            u.rate = 1.05;
            window.speechSynthesis.speak(u);
          } catch(e) {}
        }
        try {
          let cycle = 0;
          const playBurst = () => {
            if (!this.sosActive || this.muted) return;
            const ctx = this.getCtx();
            if (!ctx) return;
            const now = ctx.currentTime;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            const startFreq = cycle % 2 === 0 ? 650 : 920;
            const endFreq = cycle % 2 === 0 ? 920 : 650;
            osc.frequency.setValueAtTime(startFreq, now);
            osc.frequency.linearRampToValueAtTime(endFreq, now + 0.38);
            gain.gain.setValueAtTime(0.01, now);
            gain.gain.linearRampToValueAtTime(0.25, now + 0.04);
            gain.gain.setValueAtTime(0.25, now + 0.32);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.38);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.4);
            cycle++;
          };
          playBurst();
          this.sosInterval = setInterval(playBurst, 400);
        } catch(e) {}
      }
      stopSosAlarm() {
        this.sosActive = false;
        if (this.sosInterval) {
          clearInterval(this.sosInterval);
          this.sosInterval = null;
        }
        if ('speechSynthesis' in window) {
          try { window.speechSynthesis.cancel(); } catch(e) {}
        }
      }
      startPhoneRing() {
        if (this.muted) return;
        this.stopPhoneRing();
        try {
          const playBurst = () => {
            if (this.muted) return;
            const ctx = this.getCtx();
            if (!ctx) return;
            const now = ctx.currentTime;
            const o1 = ctx.createOscillator();
            const o2 = ctx.createOscillator();
            const g = ctx.createGain();
            o1.type = 'sine';
            o2.type = 'sine';
            o1.frequency.setValueAtTime(440, now);
            o2.frequency.setValueAtTime(480, now);
            g.gain.setValueAtTime(0.01, now);
            g.gain.linearRampToValueAtTime(0.15, now + 0.05);
            g.gain.setValueAtTime(0.15, now + 1.2);
            g.gain.exponentialRampToValueAtTime(0.001, now + 1.35);
            o1.connect(g);
            o2.connect(g);
            g.connect(ctx.destination);
            o1.start(now);
            o2.start(now);
            o1.stop(now + 1.4);
            o2.stop(now + 1.4);
          };
          playBurst();
          this.ringInterval = setInterval(playBurst, 3200);
        } catch(e) {}
      }
      stopPhoneRing() {
        if (this.ringInterval) {
          clearInterval(this.ringInterval);
          this.ringInterval = null;
        }
      }
      speak(text) {
        if (this.muted) return;
        if ('speechSynthesis' in window) {
          try {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.rate = 0.95;
            window.speechSynthesis.speak(u);
          } catch(e) {}
        }
      }
    }

                    onClick={() => setProfileModalOpen(true)}
                    className="px-4 py-2.5 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-black font-bold text-xs"
                  >
                    Edit Health Profile
                  </button>
                </div>

                {/* Lab Records Vault */}
                <div className="glass-panel p-6 rounded-3xl space-y-4">
                  <h3 className="text-lg font-bold text-white">Medical History &amp; Lab Reports Vault</h3>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {initialLabReports.map(rep => (
                      <div key={rep.id} className="p-4 rounded-2xl bg-slate-900 border border-white/10 space-y-2">
                        <div className="flex justify-between items-start">
                          <h4 className="text-sm font-bold text-white">{rep.title}</h4>
                          <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-500/20 text-emerald-300">{rep.status}</span>
                        </div>
                        <p className="text-xs text-slate-400">{rep.hospital} • {rep.date}</p>
                        <p className="text-xs text-slate-300 bg-white/5 p-2.5 rounded-xl leading-relaxed">{rep.summary}</p>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* Emergency SOS Modal */}
          {emergencySOSOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-2xl">
              <div className="relative w-full max-w-lg p-6 sm:p-8 rounded-3xl bg-slate-950 border-2 border-rose-500 shadow-glow-red text-white text-center space-y-5">
                <div className="w-16 h-16 mx-auto rounded-full bg-rose-500/20 border-2 border-rose-500 flex items-center justify-center text-3xl animate-pulse">
                  🚨
                </div>
                <div>
                  <h3 className="text-2xl font-black text-rose-400">EMERGENCY SOS ALERT</h3>
                  <p className="text-xs text-rose-200 mt-1">CERO Medical Dispatch System &amp; Siren Activated</p>
                </div>

                {/* Siren sound control & sound wave */}
                <div className="p-4 rounded-2xl bg-rose-950/40 border border-rose-500/40 text-xs space-y-2">
                  <div className="flex justify-between items-center">
                    <span className="font-bold text-rose-200">Paramedic Siren: {isAlarmMuted ? 'Muted' : 'Sounding loudly'}</span>
                    <div className="flex gap-2">
                      <button onClick={toggleMuteSOS} className="px-3 py-1 rounded-xl bg-slate-900 border border-rose-500/30 text-rose-300 font-bold">
                        {isAlarmMuted ? '🔊 Unmute Siren' : '🔇 Mute Siren'}
                      </button>
                      <button onClick={() => { sounds.startSosAlarm(); addToast('info', 'Audible Siren Triggered', 'Siren audio active.'); }} className="px-3 py-1 rounded-xl bg-rose-600 text-white font-bold">
                        Test Audio
                      </button>
                    </div>
                  </div>
                  {!isAlarmMuted && (
                    <div className="flex items-center justify-center gap-1 h-5 pt-1">
                      {[30, 80, 100, 60, 90, 45, 80, 100, 70, 50, 90, 60, 95, 40, 85, 100].map((h, i) => (
                        <div key={i} className="w-1 bg-rose-400 rounded-full animate-pulse" style={{ height: `${h}%`, animationDuration: `${0.3 + (i % 4) * 0.15}s` }} />
                      ))}
                    </div>
                  )}
                </div>

                <div className="p-4 rounded-2xl bg-slate-900 text-left text-xs space-y-1">
                  <p className="text-slate-400">GPS Location: <strong className="text-cyan-300 font-mono">28.6139° N, 77.2090° E</strong></p>
                  <p className="text-slate-200 font-semibold">Connaught Place, Central District, New Delhi</p>
                  <p className="text-emerald-400 font-semibold pt-1">SMS Alert Dispatched to {user.emergencyContact.name} ({user.emergencyContact.phone})</p>
                </div>
                <div className="flex gap-3">
                  <button onClick={handleCloseSOS} className="flex-1 py-3 rounded-xl bg-slate-800 text-xs font-bold hover:bg-slate-700">
                    Cancel SOS (I am Safe)
                  </button>
                  <button onClick={() => addToast('error', '108 Ambulance Call', 'Calling 108 Emergency')} className="flex-1 py-3 rounded-xl bg-rose-600 text-xs font-bold hover:bg-rose-500">
                    Call 108 Ambulance
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* IVR Call Modal */}
          {ivrCallOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-2xl">
              <div className="w-full max-w-md p-6 rounded-3xl bg-slate-950 border border-cyan-500 shadow-glow-cyan text-white text-center space-y-5">
                <div className="w-20 h-20 mx-auto rounded-full bg-cyan-500/20 border border-cyan-400 flex items-center justify-center text-3xl animate-bounce">
                  📞
                </div>
                <div>
                  <h3 className="text-xl font-bold">Incoming CERO Reminder Call</h3>
                  <p className="text-xs text-slate-400">+1 (800) CERO-CARE • Automated IVR</p>
                </div>
                <p className="text-xs text-slate-200 bg-slate-900 p-3 rounded-xl">
                  &ldquo;Hello {user.name}, this is your scheduled reminder for Paracetamol 650mg. Please take your dose with water.&rdquo;
                </p>
                <div className="flex gap-3">
                  <button onClick={() => { sounds.stopPhoneRing(); setIvrCallOpen(false); }} className="flex-1 py-2.5 rounded-xl bg-rose-600 text-xs font-bold">
                    Decline
                  </button>
                  <button onClick={() => {
                    sounds.stopPhoneRing();
                    setIvrCallOpen(false);
                    toggleMedicineTaken('med_1');
                  }} className="flex-1 py-2.5 rounded-xl bg-emerald-500 text-black text-xs font-bold">
                    Press 1: Mark Taken
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Video Consult Modal */}
          {videoConsultDoctor && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90 backdrop-blur-2xl">
              <div className="w-full max-w-4xl h-[80vh] rounded-3xl bg-slate-950 border border-cyan-500/40 p-6 flex flex-col justify-between text-white">
                <div className="flex justify-between items-center pb-3 border-b border-white/10">
                  <div className="flex items-center gap-2">
                    <span className="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse" />
                    <span className="text-sm font-bold">CERO Telehealth HD Video: {videoConsultDoctor.name}</span>
                  </div>
                  <button onClick={() => setVideoConsultDoctor(null)} className="px-3 py-1.5 rounded-xl bg-rose-600 text-xs font-bold">
                    Leave Call
                  </button>
                </div>

                <div className="flex-1 my-4 rounded-2xl overflow-hidden relative bg-slate-900 flex items-center justify-center">
                  <img src={videoConsultDoctor.avatar} className="w-full h-full object-cover" />
                  <div className="absolute bottom-4 right-4 w-36 h-24 rounded-xl overflow-hidden border-2 border-cyan-400 shadow-xl">
                    <img src={user.avatar} className="w-full h-full object-cover" />
                  </div>
                </div>

                <div className="flex justify-center gap-3">
                  <button onClick={() => addToast('info', 'Mic Toggled', '')} className="px-4 py-2 rounded-xl bg-slate-800 text-xs font-bold">
                    🎤 Toggle Mic
                  </button>
                  <button onClick={() => addToast('info', 'Camera Toggled', '')} className="px-4 py-2 rounded-xl bg-slate-800 text-xs font-bold">
                    📹 Toggle Video
                  </button>
                  <button onClick={() => setVideoConsultDoctor(null)} className="px-5 py-2 rounded-xl bg-rose-600 text-xs font-bold">
                    End Consult
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Prescription OCR Modal */}
          {ocrOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-xl">
              <div className="w-full max-w-md p-6 rounded-3xl bg-slate-900 border border-cyan-400 text-white space-y-4">
                <h3 className="text-base font-bold">AI Prescription OCR Scanner</h3>
                <div className="p-8 border-2 border-dashed border-cyan-500/40 rounded-2xl text-center text-xs text-slate-300">
                  📄 Doctor Prescription Scanned: Caripill 1100mg TID &amp; Telmisartan 40mg
                </div>
                <div className="flex justify-end gap-2">
                  <button onClick={() => setOcrOpen(false)} className="px-4 py-2 rounded-xl bg-slate-800 text-xs">Close</button>
                  <button onClick={() => { setOcrOpen(false); addToast('success', 'Prescription Imported', 'Medicines added to schedule.'); }} className="px-4 py-2 rounded-xl bg-cyan-500 text-black text-xs font-bold">Add to Schedule</button>
                </div>
              </div>
            </div>
          )}

          {/* Profile Setup Modal */}
          {profileModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-xl">
              <div className="w-full max-w-lg p-6 rounded-3xl bg-slate-900 border border-cyan-400 text-white space-y-4">
                <h3 className="text-lg font-bold">Edit Patient Profile</h3>
                <div className="space-y-3 text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1">Full Name</label>
                    <input type="text" value={user.name} onChange={e => setUser({...user, name: e.target.value})} className="w-full p-2.5 rounded-xl glass-input" />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-slate-400 mb-1">Age</label>
                      <input type="number" value={user.age} onChange={e => setUser({...user, age: Number(e.target.value)})} className="w-full p-2.5 rounded-xl glass-input" />
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1">Blood Group</label>
                      <input type="text" value={user.bloodGroup} onChange={e => setUser({...user, bloodGroup: e.target.value})} className="w-full p-2.5 rounded-xl glass-input" />
                    </div>
                  </div>
                  <div>
                    <label className="block text-slate-400 mb-1">Emergency Contact Phone</label>
                    <input type="text" value={user.emergencyContact.phone} onChange={e => setUser({...user, emergencyContact: {...user.emergencyContact, phone: e.target.value}})} className="w-full p-2.5 rounded-xl glass-input font-mono" />
                  </div>
                </div>
                <div className="flex justify-end gap-2 pt-2">
                  <button onClick={() => setProfileModalOpen(false)} className="px-4 py-2 rounded-xl bg-slate-800 text-xs font-bold">Cancel</button>
                  <button onClick={() => { setProfileModalOpen(false); addToast('success', 'Profile Updated', 'Health metrics synced.'); }} className="px-4 py-2 rounded-xl bg-cyan-500 text-black text-xs font-bold">Save Changes</button>
                </div>
              </div>
            </div>
          )}

          {/* Toast Container */}
          <div className="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-sm pointer-events-none">
            {toasts.map(t => (
              <div key={t.id} className="pointer-events-auto p-3.5 rounded-2xl bg-slate-900/95 border border-cyan-400/40 text-xs text-white shadow-2xl">
                <p className="font-bold text-cyan-300">{t.title}</p>
                {t.message && <p className="text-slate-300 mt-0.5">{t.message}</p>}
              </div>
            ))}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
